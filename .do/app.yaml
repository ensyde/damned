name: damned

services:
  - name: api
    dockerfile_path: apps/api/Dockerfile
    source_dir: /
    http_port: 4000
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    health_check:
      http_path: /health
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${damned-db.DATABASE_URL}
      - key: REDIS_URL
        scope: RUN_AND_BUILD_TIME
        value: ${damned-redis.REDIS_URL}
      - key: JWT_ACCESS_SECRET
        type: SECRET
        # Set via DO console/CLI: a random string of at least 32 characters
      - key: JWT_REFRESH_SECRET
        type: SECRET
        # Set via DO console/CLI: a random string of at least 32 characters
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: NEXT_PUBLIC_SITE_URL
        value: ${web.PUBLIC_URL}
      - key: SMTP_HOST
        # Set via DO console/CLI: your SMTP hostname
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        # Set via DO console/CLI: your SMTP username/address
      - key: SMTP_PASS
        type: SECRET
        # Set via DO console/CLI: your SMTP password
      - key: EMAIL_FROM
        # Set via DO console/CLI: e.g. "Damned Community <no-reply@yourdomain.com>"
      - key: S3_ENDPOINT
        # Set via DO console/CLI: your S3-compatible endpoint URL
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY
        type: SECRET
        # Set via DO console/CLI
      - key: S3_SECRET_KEY
        type: SECRET
        # Set via DO console/CLI
      - key: S3_BUCKET
        value: damned-uploads
      - key: S3_PUBLIC_URL
        # Set via DO console/CLI: public CDN URL for uploaded files
      - key: DISCORD_BOT_TOKEN
        type: SECRET
        # Set via DO console/CLI
      - key: DISCORD_GUILD_ID
        # Set via DO console/CLI: your Discord server ID
      - key: DISCORD_CLIENT_ID
        # Set via DO console/CLI: your Discord OAuth app client ID
      - key: DISCORD_CLIENT_SECRET
        type: SECRET
        # Set via DO console/CLI
      - key: DISCORD_REDIRECT_URI
        value: ${web.PUBLIC_URL}/api/auth/discord/callback
      - key: DISCORD_INVITE_URL
        # Set via DO console/CLI: e.g. https://discord.gg/your_invite

  - name: web
    dockerfile_path: apps/web/Dockerfile
    source_dir: /
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    envs:
      - key: NEXT_PUBLIC_API_URL
        scope: BUILD_TIME
        value: ${api.PUBLIC_URL}
      - key: NEXT_PUBLIC_WS_URL
        scope: BUILD_TIME
        value: ${api.PUBLIC_URL}
      - key: NEXT_PUBLIC_SITE_NAME
        scope: BUILD_TIME
        value: Damned Community
      - key: NEXT_PUBLIC_SITE_URL
        scope: BUILD_TIME
        value: ${web.PUBLIC_URL}

jobs:
  - name: db-migrate
    kind: PRE_DEPLOY
    dockerfile_path: apps/api/Dockerfile
    source_dir: /
    run_command: npm run db:migrate
    envs:
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${damned-db.DATABASE_URL}

databases:
  - name: damned-db
    engine: PG
    version: "16"
    size: db-s-dev-database
    num_nodes: 1

  - name: damned-redis
    engine: REDIS
    version: "7"
    size: db-s-dev-database
    num_nodes: 1
