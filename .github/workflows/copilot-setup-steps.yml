name: "Copilot Setup Steps"

# Run automatically when this file changes to validate it, and allow manual runs
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # Job MUST be named `copilot-setup-steps` to be picked up by the Copilot coding agent.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    # Spin up the same services used in CI so the agent can run tests and migrations
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: damned
          POSTGRES_PASSWORD: damned
          POSTGRES_DB: damned_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://damned:damned@localhost:5432/damned_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: copilot_setup_access_secret
      JWT_REFRESH_SECRET: copilot_setup_refresh_secret
      NODE_ENV: test
      # Provide placeholder values for vars the app config requires at startup.
      # The agent will override these with real secrets from the `copilot` environment.
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: http://localhost:4000
      NEXT_PUBLIC_SITE_NAME: Damned Community
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Pre-generate the Prisma client so the agent doesn't need to do it manually
      - name: Generate Prisma client
        run: npm run db:generate

      # Apply migrations so the test DB is ready for the agent to run tests immediately
      - name: Run database migrations
        working-directory: packages/db
        run: npx prisma migrate deploy
